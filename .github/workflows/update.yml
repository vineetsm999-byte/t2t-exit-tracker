name: Update T2T data

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 pm IST, Monday to Friday
  workflow_dispatch:           # manual run button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python t2t_tracker.py
      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add t2t_data.csv bse_seen.txt
          git diff --cached --quiet || git commit -m "Daily T2T update"
          git push
